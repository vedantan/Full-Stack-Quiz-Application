spring.application.name=QUESTION-SERVICE
server.port=8080

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/questionDB
spring.datasource.username=postgres
spring.datasource.password=12398765
spring.jpa.hibernate.ddl-auto=update

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Idempotency (Idempotency-Key header on the listed POST endpoints)
idempotency.protected-paths=/api/questions/addQuestion
idempotency.required=false
idempotency.in-progress-timeout-seconds=30
idempotency.ttl-hours=24
